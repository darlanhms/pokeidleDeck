<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lives</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/lives.ts" defer></script>
  </head>
  <body class="lives">
    <header class="lives-bar">
      <nav id="tabs" aria-label="Lives desta conta"></nav>
      <span class="spacer"></span>
      <button type="button" id="full-page" hidden title="Mostra a página toda, se algo do chat ficar cortado">Página inteira</button>
      <button type="button" id="points" title="A página de cada live lado a lado, só com o botão dos pontos, para resgatar na mão">Pontos</button>
      <button type="button" id="park" title="Tira a janela da tela; as lives continuam tocando e juntando pontos">Esconder</button>
    </header>
    <p class="lives-empty" id="empty">Nenhuma live aberta agora.</p>
  </body>
</html>
