<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeIdle Deck</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="top">
      <strong class="brand">PokeIdle Deck</strong>
      <div class="layouts" role="group" aria-label="Layout das contas">
        <button type="button" data-layout="grid" aria-label="Grade" title="Grade (⌘1)"></button>
        <button type="button" data-layout="columns" aria-label="Colunas" title="Colunas (⌘2)"></button>
        <button type="button" data-layout="focus" aria-label="Uma ampliada" title="Uma ampliada; as outras seguem rodando escondidas (⌘3)"></button>
      </div>
      <nav id="tabs" aria-label="Conta ampliada" hidden></nav>
      <button type="button" id="add" title="Nova conta (⌘N)">Nova conta</button>
      <span class="spacer"></span>
      <button type="button" id="echo" class="pill" title="Eco: um clique numa conta se repete nas outras (no mesmo botão). O que se digita não se repete."><span class="state"></span>Eco</button>
      <div class="group split">
        <button type="button" id="ultra" class="pill" title="ULTRA em todas as contas: o Modo ULTRA Economia do jogo. O jogo sai da tela e fica só a caixa com XP, ouro, drops e shinies; a caça continua."><span class="state"></span>ULTRA</button>
        <button type="button" id="ultra-menu" class="pill" aria-label="Opções do ULTRA e menos animações"></button>
      </div>
      <span class="divider"></span>
      <div class="zoom" role="group" aria-label="Zoom de todas as contas">
        <button type="button" id="zoom-out" aria-label="Diminuir o zoom">−</button>
        <button type="button" id="zoom-menu" title="Escolher o zoom de todas as contas">100%</button>
        <button type="button" id="zoom-in" aria-label="Aumentar o zoom">+</button>
      </div>
      <button type="button" id="deck-more" class="square" aria-label="Mais opções do deck" title="Restaurar conta removida, empilhar"></button>
      <button type="button" id="fullscreen" class="square" aria-label="Tela cheia" title="Tela cheia (F11)"></button>
    </header>
    <div id="panes"></div>
    <footer id="bottom">
      <span id="summary"></span>
      <span class="divider"></span>
      <span id="memory" title="Memória do navegador embutido (a mesma do Monitor de Atividade)">RAM: medindo…</span>
      <span id="kick"></span>
      <span class="spacer"></span>
      <button type="button" id="last-buy" hidden></button>
    </footer>
  </body>
</html>
