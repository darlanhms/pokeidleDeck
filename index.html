<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeIdle Deck</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="top">
      <strong class="brand">PokeIdle Deck</strong>
      <div class="segmented" id="layouts">
        <button type="button" data-layout="grid" title="As contas em grade">Grade</button>
        <button type="button" data-layout="columns" title="As contas lado a lado">Colunas</button>
        <button type="button" data-layout="focus" title="Uma conta ocupando o deck (as outras continuam rodando escondidas)">Ampliada</button>
      </div>
      <div id="account-buttons"></div>
      <button type="button" id="accounts-menu" class="with-icon">Contas</button>
      <span class="spacer"></span>
      <div class="segmented" id="zoom">
        <button type="button" id="zoom-out" title="Diminuir o zoom de todas as contas">−</button>
        <button type="button" id="zoom-menu" title="Zoom de todas as contas">Zoom 100%</button>
        <button type="button" id="zoom-in" title="Aumentar o zoom de todas as contas">+</button>
      </div>
      <button type="button" id="fullscreen" class="icon-only" title="Tela cheia (F11)"></button>
    </header>
    <div id="panes"></div>
    <footer id="bottom"><span id="summary"></span><span class="spacer"></span><span id="kick"></span></footer>
  </body>
</html>
