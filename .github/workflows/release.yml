name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A versão do app sai da tag (v1.2.3 → 1.2.3), sem precisar mexer nos arquivos antes.
      - name: Versão da tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1].replace(/^v/, "");
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = version;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            fs.writeFileSync("src-tauri/Cargo.toml", cargo.replace(/^version = ".*"/m, `version = "${version}"`));
          ' "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm test

      - name: Testes do Rust
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PokeIdle Deck ${{ github.ref_name }}
          releaseBody: |
            **macOS** 14 ou mais novo (Apple Silicon e Intel): baixe o `.dmg`.
            **Windows** 10 ou 11: baixe o `_x64-setup.exe`.
            Nenhum dos dois é assinado: na primeira vez, veja "Instalar" no README.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
