name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A versão do app sai da tag (v1.2.3 → 1.2.3), sem precisar mexer nos arquivos antes.
      - name: Versão da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "$VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - run: npm ci

      - run: npm test

      - name: Testes do Rust
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PokeIdle Deck ${{ github.ref_name }}
          releaseBody: |
            macOS 14 ou mais novo, Apple Silicon e Intel (universal). O app não é assinado pela Apple:
            na primeira vez, veja "Abrir mesmo assim" no README.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg
