<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nome da conta</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/prompt.ts" defer></script>
  </head>
  <body class="prompt">
    <form id="form">
      <label for="value" id="label"></label>
      <input id="value" type="text" maxlength="40" autocomplete="off" spellcheck="false" />
      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </body>
</html>
