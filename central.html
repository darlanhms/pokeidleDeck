<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lives</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/central.ts" defer></script>
  </head>
  <body class="central">
    <header class="central-bar">
      <nav id="tabs" aria-label="Conta"></nav>
      <span class="spacer"></span>
      <label class="toggle" title="Esconde os canais fora das vagas que estão offline ou sem o bônus do PokeIdle, a não ser que já deem resgate">
        <button type="button" class="switch" role="switch" id="focus-only" aria-label="Ocultar offline e sem bônus"></button>
        Ocultar offline e sem bônus
      </label>
      <button type="button" id="players" title="Mostra os players desta conta (para conferir o vídeo ou resgatar pela página)">Ver os players</button>
      <button type="button" id="config">Canais e config…</button>
    </header>
    <div class="central-body">
      <main id="main"></main>
      <aside id="feed" aria-label="Atividade"></aside>
    </div>
  </body>
</html>
